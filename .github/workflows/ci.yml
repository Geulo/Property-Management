name: CI

# Every push and pull request is linted, tested and builds both images.
# Only a push to main publishes the images to GHCR, tagged with the commit SHA.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [property, tasks]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt ruff==0.14.4
      - run: ruff check .
      # No SQL Server here yet: tests that need TEST_DATABASE_URL are skipped
      - run: python -m pytest

  images:
    needs: test  # no image is built from a commit whose tests failed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # lets the built-in GITHUB_TOKEN push to GHCR
    strategy:
      matrix:
        service: [property, tasks]
    steps:
      - uses: actions/checkout@v4
      # image names must be lowercase, and the owner is "Geulo"
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ env.OWNER }}/pm-${{ matrix.service }}:${{ github.sha }}
          # links the package to this repository, so it shows under the repo's Packages
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # reuse layers from earlier runs, one cache per service
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
