name: CI

# Every push and pull request is linted, tested (unit tests against SQL Server, and an integration
# test across the seam on the compose stack) and builds both images.
# Only a push to main publishes the images to GHCR, tagged with the commit SHA.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [property, tasks]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A throwaway SQL Server for this job only. Its password is generated here and masked in
      # the log, so no secret lives in the repository. CI never touches Azure SQL.
      - name: Start SQL Server
        run: |
          SA_PASSWORD="Ci$(openssl rand -hex 12)_X9"
          echo "::add-mask::$SA_PASSWORD"
          docker run -d --name sqlserver -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SA_PASSWORD" \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          echo "SA_PASSWORD=$SA_PASSWORD" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=mssql://sa:$SA_PASSWORD@localhost:1433/${{ matrix.service }}_test" >> "$GITHUB_ENV"
      - run: pip install -r requirements-dev.txt ruff==0.14.4
      - run: ruff check .
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 40); do
            docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" \
              -Q "SELECT 1" -b -o /dev/null && exit 0
            sleep 3
          done
          exit 1
      # fails the job if the service's own code is less than 70% covered
      - run: python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=70

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # compose reads its passwords from .env; here they are generated for this run only
      - name: Write a throwaway .env
        run: |
          for name in SA_PASSWORD PROPERTY_DB_PASSWORD TASKS_DB_PASSWORD; do
            value="Ci$(openssl rand -hex 12)_X9"; echo "::add-mask::$value"; echo "$name=$value" >> .env
          done
          echo "SECRET_KEY=$(openssl rand -hex 32)" >> .env
      - run: docker compose up --build -d
      - run: pip install -r tests/integration/requirements.txt
      - run: python -m pytest tests/integration -v
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color property tasks db-init

  images:
    needs: [test, integration]  # no image is built from a commit whose tests failed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # lets the built-in GITHUB_TOKEN push to GHCR
    strategy:
      matrix:
        service: [property, tasks]
    steps:
      - uses: actions/checkout@v4
      # image names must be lowercase, and the owner is "Geulo"
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ env.OWNER }}/pm-${{ matrix.service }}:${{ github.sha }}
          # links the package to this repository, so it shows under the repo's Packages
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # reuse layers from earlier runs, one cache per service
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
