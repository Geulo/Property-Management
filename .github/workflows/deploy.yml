name: Deploy

# Continuous deployment to Azure. Runs by itself after the CI workflow finishes on main, and
# deploys only if CI passed: then the images CI pushed for that exact commit exist in GHCR.
# One-time setup (resource group, SQL, environment, secrets): infra/setup.sh.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  id-token: write   # lets azure/login get a GitHub OIDC token, so no Azure password is stored
  contents: read

# Two pushes in a row: the second deploy waits for the first instead of both running at once.
concurrency:
  group: deploy-azure
  cancel-in-progress: false

env:
  # The commit CI tested and built images for (not "the latest").
  GIT_SHA: ${{ github.event.workflow_run.head_sha }}
  # Resource names, created by infra/setup.sh (not secrets).
  RESOURCE_GROUP: rjpenning-ieu2024-rg
  CONTAINERAPPS_ENV: rjpenning-ieu2024-env
  PROPERTY_APP: rjpenning-ieu2024-property
  TASKS_APP: rjpenning-ieu2024-tasks
  UI_STORAGE: rjpenningieu2024ui
  HEALTH_TIMEOUT_S: 180   # serverless SQL resume + container cold start can take a while

jobs:
  deploy:
    # Only a successful CI run from a push to main (not a pull request whose branch is called main).
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      # Check out the same commit, so the UI files match the deployed services.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.GIT_SHA }}

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install the Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --yes --only-show-errors

      # The UI's address is the only origin the services accept cross-origin calls from.
      - name: Look up the UI origin
        run: |
          web=$(az storage account show -g "$RESOURCE_GROUP" -n "$UI_STORAGE" --query primaryEndpoints.web -o tsv)
          echo "CORS_ORIGIN=${web%/}" >> "$GITHUB_ENV"   # drop the trailing slash: an origin has none

      - name: Deploy the property service
        id: property
        env:
          DATABASE_URL: ${{ secrets.PROPERTY_DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          host=$(bash infra/deploy-app.sh "$PROPERTY_APP" "ghcr.io/geulo/pm-property:$GIT_SHA")
          echo "url=https://$host" >> "$GITHUB_OUTPUT"

      - name: Deploy the tasks service
        id: tasks
        env:
          DATABASE_URL: ${{ secrets.TASKS_DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          # tasks calls property server side when a task is added, so it gets property's URL
          host=$(bash infra/deploy-app.sh "$TASKS_APP" "ghcr.io/geulo/pm-tasks:$GIT_SHA" \
            "PROPERTY_URL=${{ steps.property.outputs.url }}")
          echo "url=https://$host" >> "$GITHUB_OUTPUT"

      # The UI is plain files; its only build step is writing config.js with the services' URLs.
      - name: Deploy the UI
        run: |
          cat > ui/config.js <<EOF
          // Generated by .github/workflows/deploy.yml for commit $GIT_SHA
          window.APP_CONFIG = {
            PROPERTY_URL: "${{ steps.property.outputs.url }}",
            TASKS_URL: "${{ steps.tasks.outputs.url }}",
          };
          EOF
          # $web is the container the storage static website serves from
          az storage blob upload-batch --account-name "$UI_STORAGE" --auth-mode login \
            --destination '$web' --source ui --overwrite --output none
          echo "UI deployed to $CORS_ORIGIN"

      # Fail the run unless both services answer 200 on /health with this commit's SHA as version
      # (proves the new revision is live and can read and write its database).
      - name: Health check
        run: |
          deadline=$((SECONDS + HEALTH_TIMEOUT_S))
          for url in "${{ steps.property.outputs.url }}" "${{ steps.tasks.outputs.url }}"; do
            # curl -f fails on any status >= 400 (503 = database not reachable yet)
            until curl -fsS --max-time 20 "$url/health" | jq -e --arg sha "$GIT_SHA" '.status == "ok" and .version == $sha'; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::$url/health did not return 200 with version $GIT_SHA within ${HEALTH_TIMEOUT_S}s"
                exit 1
              fi
              echo "waiting for $url/health ..."
              sleep 10
            done
            echo "$url/health OK"
          done
