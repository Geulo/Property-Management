name: Contracts

# Checks the machine-readable descriptions of the system on every push and pull request:
#   - system.yaml against the course's system.schema.json (JSON Schema)
#   - each service's openapi.yaml against the OpenAPI specification
# Separate from ci.yml so the code pipeline and the contract checks can change apart.
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pinned, so a new validator release cannot turn the build red on its own
      - run: pip install check-jsonschema==0.39.0 openapi-spec-validator==0.9.0

      - name: system.yaml matches system.schema.json
        run: check-jsonschema --schemafile system.schema.json system.yaml

      - name: Each openapi.yaml is a valid OpenAPI document
        run: openapi-spec-validator services/property/openapi.yaml services/tasks/openapi.yaml
