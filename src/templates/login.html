<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Manager Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="login-container">

        <h1>Property Manager</h1>
        <p>Manage properties, maintenance tasks, and tenants.</p>

        <form method="POST" action="/login">

            <input
                type="email"
                name="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Sign In
            </button>

        </form>

    </div>

</body>
</html>
