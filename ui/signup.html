<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="login-container">
        <h1>Create Account</h1>
        <p class="error-message" id="error" hidden></p>
        <form id="signup-form">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Sign Up
            </button>

        </form>

        <div class="signup-hyperlink">
            <a href="login.html">Already have an account? Sign In</a>
        </div>

    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
        const form = document.getElementById("signup-form");
        const error = document.getElementById("error");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            try {
                await api(PROPERTY_URL, "/signup", "POST", {
                    username: form.username.value,
                    email: form.email.value,
                    password: form.password.value,
                });
                // signing up does not log in, as in Assignment 1: go to the login page
                window.location.href = "login.html";
            } catch (err) {
                showError(error, err.message);
            }
        });
    </script>
</body>
</html>
