<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Manager Homepage</title>
    <link rel="stylesheet" href="{{url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="add-property-popup" onclick="myFunction()">Add a Property
        <span class="add-property-popuptext" id="myPopup">
        </span>
    </div>

    <script>
        // When the user clicks on <div>, open the popup
        function myFunction() {
        var popup = document.getElementById("myPopup");
        popup.classList.toggle("show");}
    </script>
</body>
</html>
